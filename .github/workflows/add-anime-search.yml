name: Add anime database search

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-anime-search.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          css_old = '.modal-box h2{margin:0 0 16px}.form{display:grid;gap:12px}'
          css_new = '''.modal-box h2{margin:0 0 16px}.anime-picker{display:grid;gap:12px}.anime-results{display:grid;gap:8px;max-height:420px;overflow:auto}.anime-result{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);background:#091322;border-radius:7px;cursor:pointer}.anime-result:hover{border-color:#35506f;background:#0c1727}.anime-result img{width:54px;height:76px;object-fit:cover;border-radius:5px;background:#17263b}.anime-result-name{font-weight:850}.anime-result-meta{font-size:12px;color:var(--muted);margin-top:4px}.anime-description{font-size:13px;line-height:1.55;color:#b8c5d6;max-height:110px;overflow:auto}.selected-anime{display:grid;grid-template-columns:70px 1fr;gap:14px;padding:12px;border:1px solid #29405e;background:#0b1829;border-radius:7px}.selected-anime img{width:70px;height:96px;object-fit:cover;border-radius:5px} .form{display:grid;gap:12px}'''
          if css_old not in s:
              raise SystemExit('CSS anchor not found')
          s = s.replace(css_old, css_new, 1)

          old = '''function openAdd(){showModal(`<h2>Add title</h2><form class="form" onsubmit="addTitle(event)"><div class="field"><label>Name</label><input id="newName" class="input" required placeholder="e.g. Jujutsu Kaisen"></div><div class="field"><label>Type</label><select id="newType" class="select"><option value="anime">Anime</option><option value="manga">Manga</option></select></div><div class="field"><label>Total episodes/chapters (optional)</label><input id="newTotal" class="input" type="number" min="0" placeholder="24"></div><div class="field"><label>Status</label><select id="newStatus" class="select"><option value="planned">Plan to watch</option><option value="watching">Watching</option><option value="completed">Completed</option></select></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Add title</button></div></form>`)}
async function addTitle(ev){ev.preventDefault();const name=document.getElementById('newName').value.trim(),type=document.getElementById('newType').value,total=Number(document.getElementById('newTotal').value)||null,status=document.getElementById('newStatus').value;let {data:t,error}=await db.from('titles').select('*').eq('name',name).eq('media_type',type).maybeSingle();if(error){toast('Could not add title.');return}if(!t){const payload={name,media_type:type,total_episodes:type==='anime'?total:null,total_chapters:type==='manga'?total:null};const r=await db.from('titles').insert(payload).select().single();if(r.error){toast('Could not create title.');return}t=r.data}const r=await db.from('library_entries').insert({user_id:user.id,title_id:t.id,status,progress:status==='completed'?(total||0):0,rating:null,notes:'',is_favorite:false}).select('*,title:titles(*)').single();if(r.error){toast('That title is already in your library.');return}entries.push(r.data);closeModal();toast('Title added!');render()}'''

          new = '''let selectedAnime=null, animeSearchTimer=null;
async function searchAnimeDatabase(q){
  const box=document.getElementById('animeResults');
  if(!box)return;
  q=q.trim();
  if(!q){box.innerHTML='<div class="empty">Start typing an anime title to search.</div>';return}
  box.innerHTML='<div class="empty">Searching anime database…</div>';
  const query=`query ($search:String){Page(page:1,perPage:8){media(search:$search,type:ANIME,sort:SEARCH_MATCH){id,title{romaji english native},description(asHtml:false),episodes,status,genres,coverImage{large},seasonYear}}}`;
  try{
    const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query,variables:{search:q}})});
    const j=await r.json();
    const results=j?.data?.Page?.media||[];
    if(!results.length){box.innerHTML='<div class="empty">No anime found. Try another title.</div>';return}
    box.innerHTML=results.map(a=>{const name=a.title?.english||a.title?.romaji||a.title?.native||'Untitled';return `<div class="anime-result" onclick="selectAnime(${JSON.stringify(a).replace(/</g,'\\u003c')})"><img src="${esc(a.coverImage?.large||'')}" alt=""><div><div class="anime-result-name">${esc(name)}</div><div class="anime-result-meta">${a.seasonYear||'—'} • ${a.episodes||'?'} episodes • ${(a.genres||[]).slice(0,3).map(esc).join(' • ')}</div></div><span class="muted">Select</span></div>`}).join('');
  }catch(e){box.innerHTML='<div class="empty">Could not reach the anime database. You can still enter a title manually.</div>'}
}
function selectAnime(a){selectedAnime=a;const name=a.title?.english||a.title?.romaji||a.title?.native||'Untitled';document.getElementById('newName').value=name;document.getElementById('newTotal').value=a.episodes||'';document.getElementById('selectedAnime').innerHTML=`<div class="selected-anime"><img src="${esc(a.coverImage?.large||'')}" alt=""><div><b>${esc(name)}</b><div class="anime-result-meta">${a.seasonYear||'—'} • ${a.episodes||'?'} episodes • ${(a.genres||[]).slice(0,4).map(esc).join(' • ')}</div><p class="anime-description">${esc(a.description||'No description available.')}</p></div></div>`;document.getElementById('animeResults').innerHTML='<div class="empty">Selected. You can add it below.</div>'}
function openAdd(){selectedAnime=null;showModal(`<h2>Add title</h2><div class="anime-picker"><div class="field"><label>Search anime database</label><input id="animeSearch" class="input" placeholder="Search for an anime…" autocomplete="off"></div><div id="animeResults" class="anime-results"><div class="empty">Start typing an anime title to search.</div></div><div id="selectedAnime"></div><form class="form" onsubmit="addTitle(event)"><div class="field"><label>Name</label><input id="newName" class="input" required placeholder="Or type a title manually"></div><div class="field"><label>Type</label><select id="newType" class="select"><option value="anime">Anime</option><option value="manga">Manga</option></select></div><div class="field"><label>Total episodes/chapters (optional)</label><input id="newTotal" class="input" type="number" min="0" placeholder="24"></div><div class="field"><label>Status</label><select id="newStatus" class="select"><option value="planned">Plan to watch</option><option value="watching">Watching</option><option value="completed">Completed</option></select></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Add title</button></div></form></div>`);document.getElementById('animeSearch').addEventListener('input',e=>{clearTimeout(animeSearchTimer);animeSearchTimer=setTimeout(()=>searchAnimeDatabase(e.target.value),350)})}
async function addTitle(ev){ev.preventDefault();const name=document.getElementById('newName').value.trim(),type=document.getElementById('newType').value,total=Number(document.getElementById('newTotal').value)||null,status=document.getElementById('newStatus').value;let {data:t,error}=await db.from('titles').select('*').eq('name',name).eq('media_type',type).maybeSingle();if(error){toast('Could not add title.');return}if(!t){const payload={name,media_type:type,total_episodes:type==='anime'?total:null,total_chapters:type==='manga'?total:null,description:selectedAnime?.description||null,cover_url:selectedAnime?.coverImage?.large||null};const r=await db.from('titles').insert(payload).select().single();if(r.error){toast('Could not create title.');return}t=r.data}else if(selectedAnime){const meta={description:selectedAnime.description||t.description||null,cover_url:selectedAnime.coverImage?.large||t.cover_url||null};const r=await db.from('titles').update(meta).eq('id',t.id).select().single();if(!r.error)t=r.data}const r=await db.from('library_entries').insert({user_id:user.id,title_id:t.id,status,progress:status==='completed'?(total||0):0,rating:null,notes:'',is_favorite:false}).select('*,title:titles(*)').single();if(r.error){toast('That title is already in your library.');return}entries.push(r.data);closeModal();toast('Title added!');render()}'''
          if old not in s:
              raise SystemExit('openAdd anchor not found')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add anime database search and descriptions'
          git push
