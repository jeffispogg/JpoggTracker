name: Fix library seeding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-library-seeding.yml'

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Stop automatic library seeding')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove automatic starter-library seeding
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "if(!entries.length){await seedLibrary();const r=await db.from('library_entries').select('*,title:titles(*)').eq('user_id',user.id);entries=r.data||[]}"
          new = ""
          if old not in s:
              raise SystemExit('Target code was not found; refusing to modify index.html')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and remove this temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-library-seeding.yml
          git commit -m 'Stop automatic library seeding'
          git push
