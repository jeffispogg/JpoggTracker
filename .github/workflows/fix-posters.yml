name: Fix poster hydration
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-posters.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix poster hydration loop
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="if(n.dataset.done)return;"
          new="if(n.dataset.done)continue;"
          if old not in s:
            raise SystemExit('poster hydration pattern not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix poster hydration loop'
          git push