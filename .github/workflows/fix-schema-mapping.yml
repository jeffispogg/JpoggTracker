name: Fix library schema mapping

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-schema-mapping.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch schema mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "async function loadData(){if(!user)return;let{data:p}=await db.from('profiles').select('*').eq('id',user.id).single();profile=p;if(!profile)return;let{data}=await db.from('library_entries').select('*,title:titles(*)').eq('user_id',user.id);entries=data||[]}"
          new = "async function loadData(){if(!user)return;let{data:p}=await db.from('profiles').select('*').eq('id',user.id).single();profile=p;if(!profile)return;let{data}=await db.from('library_entries').select('*,title:titles(*)').eq('user_id',user.id);entries=(data||[]).map(e=>{if(e.title){e.title.type=e.title.media_type;e.title.total=e.title.media_type==='anime'?e.title.total_episodes:e.title.total_chapters;e.title.favorite=e.is_favorite}return e})}"
          if old not in s:
              raise SystemExit('loadData anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix library schema mapping'
          git push
