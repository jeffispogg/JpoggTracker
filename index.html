const SUPABASE_URL='https://laxrueezpovgtyczeweh.supabase.co',SUPABASE_KEY='sb_publishable_APP_OdQ6qCDc82VASpJUdQ_jCdVElen';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let user=null,profile=null,entries=[],currentPage='dashboard',libraryFilter='all',librarySearch='',librarySort='rating',authMode='login';const colors=['#275b73','#624f92','#3f6d57','#755b3e','#4e4f88','#714d69'];

function library(type){let a=list(type),counts={all:entries.filter(e=>e.title?.type===type).length,watching:entries.filter(e=>e.title?.type===type&&e.status==='watching').length,planned:entries.filter(e=>e.title?.type===type&&e.status==='planned').length,completed:entries.filter(e=>e.title?.type===type&&e.status==='completed').length};$('page-'+type).innerHTML=`<div class="panel"><div class="panel-head"><h2>${type==='anime'?'Anime':'Manga'} Library</h2><div class="tabs">${Object.entries({all:'All',watching:'Watching',planned:'Planned',completed:'Completed'}).map(([k,v])=>`<button class="tab ${libraryFilter===k?'active':''}" onclick="setFilter('${k}')">${v} ${counts[k]}</button>`).join('')}</div></div><div class="toolbar"><input class="input search" placeholder="Search your library" value="${esc(librarySearch)}" oninput="librarySearch=this.value;render()"><select class="select" onchange="librarySort=this.value;render()"><option value="rating" ${librarySort==='rating'?'selected':''}>Rating</option><option value="name" ${librarySort==='name'?'selected':''}>Name</option></select></div><div class="anime-list">${a.length?a.map(row).join(''):'<div class="empty">Nothing here yet. Add a title to get started.</div>'}</div></div>`;setTimeout(()=>{document.querySelectorAll('.anime[data-id]').forEach(n=>n.onclick=()=>openDetails(n.dataset.id));hydratePosters()},0)}

(people||'—')}</span></div><div class="details-stat"><b>Source</b><span>${esc(m?.source||'—')}</span></div><div class="details-stat"><b>Favorite</b><span>${e.favorite?'Yes':'No'}</span></div></div></div><div class="details-actions"><button class="btn primary" onclick="closeModal();openEdit('${esc(e.id)}')">Edit my entry</button><button class="btn" onclick="closeModal()">Close</button></div>`}

async function titleSearchModal(edit){if(edit){$('modal').classList.remove('hidden');$('modalBox').className='modal-box';$('modalBox').innerHTML=`<h2>Edit entry</h2>${editFields(edit)}`;return} $('modal').classList.remove('hidden');$('modalBox').className='modal-box';$('modalBox').innerHTML=`<h2>Add title</h2><div class="form"><div class="field"><label>Search anime or manga</label><input id="newName" class="input" placeholder="Start typing a title…" autocomplete="off"></div><div class="field"><label>Type</label><select id="newType" class="select"><option value="anime">Anime</option><option value="manga">Manga</option></select></div><div id="searchResults" class="anime-list"></div><div id="selectedPreview"></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button type="button" class="btn primary" id="confirmAdd" disabled>Add to my library</button></div></div>`;let timer,selected=null,request=0;const run=async()=>{let q=$('newName').value.trim(),type=$('newType').value,id=++request;selected=null;$('confirmAdd').disabled=true;if(q.length<2){$('searchResults').innerHTML='';return}$('searchResults').innerHTML='<div class="empty">Searching…</div>';let endpoint=type==='manga'?'manga':'anime';try{let r=await fetch(`https://api.jikan.moe/v4/${endpoint}?q=${encodeURIComponent(q)}&limit=8&sfw=true`);if(r.status===429){$('searchResults').innerHTML='<div class="empty">Search is busy. Try again in a moment.</div>';return}let j=await r.json();if(id!==request)return;let list=j.data||[];$('searchResults').innerHTML=list.length?list.map((m,i)=>`<button type="button" class="anime" data-result="${i}" style="text-align:left;color:#fff"><div class="cover">${imageOf(m)?`<img src="${esc(imageOf(m))}" alt="" loading="lazy">`:`<span class="cover-fallback">${esc(initials(m.title))}</span>`}</div><div><div class="anime-name">${esc(m.title||'Untitled')}</div><div class="tags">${esc(m.year||'')} · ${esc(type==='anime'?(m.episodes??'?')+' episodes':(m.chapters??'?')+' chapters')} · ${m.score!=null?esc(m.score+'/10'):'No score'}</div></div></button>`).join(''):'<div class="empty">No matches found.</div>';$('searchResults').querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>{selected=list[Number(b.dataset.result)];$('selectedPreview').innerHTML=`<div class="notice"><b>${esc(selected.title)}</b><br><span class="muted">${esc(selected.synopsis||'No synopsis available.')}</span></div>`;$('confirmAdd').disabled=false})}catch(e){$('searchResults').innerHTML='<div class="empty">Could not reach the title database.</div>'}};$('newName').oninput=()=>{clearTimeout(timer);timer=setTimeout(run,350)};$('newType').onchange=run;$('confirmAdd').onclick=async()=>{if(!selected)return;let type=$('newType').value,name=selected.title,total=type==='anime'?selected.episodes:selected.chapters;let{data:t,error:te}=await db.from('titles').select('*').eq('name',name).eq('media_type',type).maybeSingle();if(te){toast(te.message);return}if(!t){let r=await db.from('titles').insert({name,media_type:type,total_episodes:type==='anime'?total:null,total_chapters:type==='manga'?total:null,description:selected.synopsis||null,cover_url:imageOf(selected)||null}).select().single();if(r.error){toast(r.error.message);return}t=r.data}let r=await db.from('library_entries').insert({user_id:user.id,title_id:t.id,status:'planned',progress:0}).select('*,title:titles(*)').single();if(r.error){toast(r.error.message);return}r.data.title.type=r.data.title.media_type;r.data.title.total=r.data.title.media_type==='anime'?r.data.title.total_episodes:r.data.title.total_chapters;r.data.title.favorite=r.data.is_favorite;entries.push(r.data);closeModal();render();toast('Added to your library')};}
function editFields(e){return `<div class="form"><div class="field"><label>Status</label><select id="editStatus" class="select"><option ${e.status==='planned'?'selected':''}>planned</option><option ${e.status==='watching'?'selected':''}>watching</option><option ${e.status==='completed'?'selected':''}>completed</option></select></div><div class="field"><label>Progress</label><input id="editProgress" class="input" type="number" min="0" value="${esc(e.progress??0)}"></div><div class="field"><label>Total</label><input id="editTotal" class="input" type="number" min="0" value="${esc(e.total??'')}"></div><div class="field"><label>Rating</label><input id="editRating" class="input" type="number" min="0" max="10" step="0.1" value="${esc(e.rating??'')}"></div><div class="field"><label>Notes</label><textarea id="editNotes" class="input" rows="3">${esc(e.notes||'')}</textarea></div><div class="modal-actions"><button class="btn danger" onclick="deleteEntry('${esc(e.id)}')" type="button">Delete</button><button class="btn" onclick="closeModal()" type="button">Cancel</button><button class="btn primary" onclick="saveEdit('${esc(e.id)}')" type="button">Save</button></div></div>`}async function openEdit(id){let e=entries.find(x=>String(x.id)===String(id));if(e)titleSearchModal(e)}async function saveEdit(id){let e=entries.find(x=>String(x.id)===String(id));if(!e)return;let patch={status:$('editStatus').value,progress:Number($('editProgress').value)||0,total:$('editTotal').value?Number($('editTotal').value):null,rating:$('editRating').value?Number($('editRating').value):null,notes:$('editNotes').value};let r=await db.from('library_entries').update(patch).eq('id',id).eq('user_id',user.id).select('*,title:titles(*)').single();if(r.error){toast(r.error.message);return}Object.assign(e,r.data);closeModal();render();toast('Saved')}async function deleteEntry(id){if(!confirm('Delete this library entry?'))return;let r=await db.from('library_entries').delete().eq('id',id).eq('user_id',user.id);if(r.error){toast(r.error.message);return}entries=entries.filter(e=>String(e.id)!==String(id));closeModal();render();toast('Deleted')}
async function signOut(){await db.auth.signOut();user=null;profile=null;entries=[];$('appView').classList.add('hidden');$('authView').classList.remove('hidden')}$('switchAuth').onclick=()=>{authMode=authMode==='login'?'signup':'login';$('nameField').classList.toggle('hidden',authMode==='login');$('usernameField').classList.toggle('hidden',authMode==='login');$('authSubmit').textContent=authMode==='login'?'Sign in':'Create account';$('switchText').textContent=authMode==='login'?"Don't have an account?":'Already have an account?';$('switchAuth').textContent=authMode==='login'?'Create one':'Sign in'};$('authForm').onsubmit=async e=>{e.preventDefault();let email=$('email').value,password=$('password').value;if(authMode==='login'){let r=await db.auth.signInWithPassword({email,password});if(r.error){$('authNotice').textContent=r.error.message;$('authNotice').classList.remove('hidden');return}}else{let r=await db.auth.signUp({email,password,options:{data:{display_name:$('displayName').value.trim(),username:$('username').value.trim()}}});if(r.error){$('authNotice').textContent=r.error.message;$('authNotice').classList.remove('hidden');return}if(!r.data.session){$('authNotice').textContent='Check your email to confirm your account.';$('authNotice').classList.remove('hidden');return}}};async function finish(){let r=await db.auth.getSession();user=r.data.session?.user||null;if(!user)return;$('authView').classList.add('hidden');$('appView').classList.remove('hidden');await loadData();render()}db.auth.onAuthStateChange((event,session)=>{if(session&&!user){user=session.user;setTimeout(finish,0)}});document.querySelectorAll('#sideNav button,#mobileNav button').forEach(b=>b.onclick=()=>nav(b.dataset.page));$('refreshBtn').onclick=async()=>{await loadData();render();toast('Refreshed')};$('addBtn').onclick=openAdd;$('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};finish();</script></body></html>
