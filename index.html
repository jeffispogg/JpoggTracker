*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#12294a 0,#060b14 35%),var(--bg);color:var(--text);font:15px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{border-right:1px solid var(--line);padding:22px 16px;background:#07101ddd;backdrop-filter:blur(12px);position:sticky;top:0;height:100vh}.brand{font-size:22px;font-weight:900;letter-spacing:-.5px;padding:8px 10px 28px}.brand span{color:var(--cyan)}.nav button{width:100%;text-align:left;background:none;border:0;color:var(--muted);padding:12px 13px;border-radius:12px;margin:3px 0}.nav button:hover,.nav button.active{background:#12233a;color:#fff}.side-bottom{position:absolute;bottom:18px;left:16px;right:16px}.user-mini{border:1px solid var(--line);background:#0b1524;border-radius:14px;padding:12px}.avatar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#06101b;font-weight:900}.row{display:flex;align-items:center;gap:10px}.main{padding:28px 34px;max-width:1500px;width:100%;margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}.eyebrow{color:var(--cyan);font-size:12px;text-transform:uppercase;letter-spacing:1.5px;font-weight:800}.title{font-size:34px;font-weight:900;letter-spacing:-1.5px;margin:4px 0}.muted{color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#0d192a;color:#fff;padding:10px 14px;border-radius:11px}.btn:hover{border-color:#35506f}.btn.primary{border:0;background:linear-gradient(135deg,#4bcfff,#8875ff);color:#06101b;font-weight:900}.btn.danger{color:#ff9bab}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat,.panel,.card{background:linear-gradient(180deg,#0d1829dd,#0a1321dd);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.stat{padding:18px}.stat .num{font-size:28px;font-weight:900;margin-top:5px}.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}.panel{padding:20px;margin-bottom:16px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.panel h2{font-size:18px;margin:0}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tab{border:1px solid transparent;background:#0a1422;color:var(--muted);padding:8px 11px;border-radius:9px}.tab.active{background:#172a43;color:#fff;border-color:#2a405e}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.input,.select{background:#07111f;border:1px solid var(--line);color:#fff;padding:10px 12px;border-radius:11px;outline:none}.input:focus,.select:focus{border-color:#4d789f}.search{flex:1;min-width:190px}.anime-list{display:grid;gap:9px}.anime{display:grid;grid-template-columns:50px minmax(180px,1fr) 150px 80px 85px;align-items:center;gap:14px;padding:12px;border:1px solid transparent;border-radius:14px;background:#091322}.anime:hover{border-color:#223754;background:#0c1727}.cover{width:50px;height:66px;border-radius:9px;display:grid;place-items:center;font-weight:900;color:#fff;background:linear-gradient(145deg,#1f5672,#614b9a);box-shadow:inset 0 0 30px #0004}.anime-name{font-weight:850}.tags{font-size:12px;color:var(--muted);margin-top:4px}.progress{height:7px;background:#18253a;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));border-radius:99px}.ptext{font-size:11px;color:var(--muted);margin-top:5px}.rating{font-weight:900}.rating.good{color:#75e7b0}.rating.none{color:#61738d}.continue{padding:20px;background:linear-gradient(135deg,#10233b,#12152d);border:1px solid #29405e;border-radius:18px}.continue .big{font-size:22px;font-weight:900}.barline{margin:14px 0}.friend{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:10px}.friend:last-child{border-bottom:0}.profile-card{display:flex;align-items:center;gap:14px}.profile-big{width:62px;height:62px;border-radius:17px;font-size:22px}.empty{padding:35px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px;z-index:10}.modal-box{width:min(520px,100%);background:#0b1524;border:1px solid #29405e;border-radius:20px;padding:22px;box-shadow:0 30px 90px #000c}.modal-box h2{margin:0 0 16px}.form{display:grid;gap:12px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:700}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:8px}.toast{position:fixed;right:22px;bottom:22px;background:#102039;border:1px solid #31506f;color:#fff;padding:12px 15px;border-radius:12px;z-index:30;box-shadow:var(--shadow)}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 10%,#18395e,#060b14 50%)}.auth-box{width:min(430px,100%);background:#0a1422f2;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 30px 100px #000c}.auth-logo{text-align:center;font-size:30px;font-weight:950;margin-bottom:8px}.auth-logo span{color:var(--cyan)}.auth-switch{text-align:center;margin-top:16px;color:var(--muted)}.link{color:var(--cyan);background:none;border:0;padding:0}.notice{padding:11px 12px;border-radius:11px;background:#102039;color:#a9bad0;font-size:13px}.mobile-nav{display:none}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.anime{grid-template-columns:50px 1fr 80px}.anime .prog{display:none}.sidebar{display:none}.app{display:block}.main{padding:20px 15px 85px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:5;background:#08111ff2;border-top:1px solid var(--line);padding:8px;justify-content:space-around}.mobile-nav button{background:none;border:0;color:var(--muted);font-size:12px}.mobile-nav button.active{color:#fff}.topbar{align-items:flex-start}.title{font-size:28px}}

<body>
<div id="authView" class="auth">

</div>
<div id="appView" class="hidden">
<div class="app">
<aside class="sidebar">
  <div class="brand">JPOGG<span>Tracker</span></div>
  <nav class="nav" id="sideNav">

    <button data-page="anime">◈ &nbsp; Anime Library</button>
    <button data-page="manga">▣ &nbsp; Manga Library</button>

  <div class="side-bottom"><div class="user-mini"><div class="row"><div id="sideAvatar" class="avatar">J</div><div style="min-width:0"><b id="sideName">User</b><div id="sideUser" class="muted" style="font-size:12px">@user</div></div></div></div></div>
</aside>
<main class="main">
  <div class="topbar"><div><div class="eyebrow">JPOGGTracker 2.0</div><div id="pageTitle" class="title">Dashboard</div><div id="pageSub" class="muted">Your collection at a glance.</div></div><div class="actions"><button class="btn" id="refreshBtn">↻ Refresh</button><button class="btn primary" id="addBtn">＋ Add title</button></div></div>

  <section id="page-manga" class="page hidden"></section>

</main>
</div>
<nav class="mobile-nav" id="mobileNav"><button data-page="dashboard">⌂<br>Home</button><button data-page="anime">◈<br>Anime</button><button data-page="manga">▣<br>Manga</button><button data-page="friends">♧<br>Friends</button><button data-page="profile">◎<br>Profile</button></nav>
</div>

<script>
const SUPABASE_URL='https://laxrueezpovgtyczeweh.supabase.co';
const SUPABASE_KEY='sb_publishable_APP_OdQ6qCDc82VASpJUdQ_jCdVElen';
const {createClient}=supabase; const db=createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null, profile=null, entries=[], titles=[], currentPage='dashboard', libraryFilter='all', librarySearch='', librarySort='rating', authMode='login';
const seed=[
['Attack on Titan','anime',87,87,10,'completed','Masterpiece • TOP 3'],['Fullmetal Alchemist: Brotherhood','anime',64,64,10,'completed','TOP 3'],['Samurai Champloo','anime',26,26,10,'completed','TOP 1'],['Vinland Saga','anime',48,48,10,'completed',''],['Gurren Lagann','anime',27,27,10,'completed','Amazing'],['Bleach','anime',366,366,9,'completed','Manga 9/10 • TYBW 10/10'],['Dr. Stone','anime',81,81,9,'completed','Manga 9/10'],['Demon Slayer','anime',63,63,8.4,'completed','Pretty good'],['One Punch Man','anime',24,24,7.5,'completed','Anime + Manga'],['Black Clover','anime',170,170,8,'completed','Anime + Manga • Great'],['Solo Leveling','anime',25,25,7,'completed',''],['The God of High School','anime',13,13,8,'completed',''],['Anohana: The Flower We Saw That Day','anime',11,11,10,'completed','100/10'],['Re:Zero − Starting Life in Another World','anime',66,0,null,'watching','Currently watching'],['Soul Eater','anime',51,0,null,'watching','Currently watching'],['Steins;Gate','anime',24,0,null,'planned',''],['Sonny Boy','anime',12,0,null,'planned',''],['Yamada-kun and the Seven Witches','anime',12,0,null,'planned',''],['World Trigger','anime',99,0,null,'planned',''],['Vivy: Fluorite Eye’s Song','anime',13,0,null,'planned',''],['Angel Beats!','anime',13,0,null,'planned',''],['Psycho-Pass','anime',41,0,null,'planned',''],['Frieren: Beyond Journey’s End','anime',28,0,null,'planned',''],['86 Eighty-Six','anime',23,0,null,'planned',''],['Akudama Drive','anime',12,0,null,'planned',''],['Bungo Stray Dogs','anime',61,0,null,'planned',''],['Mob Psycho 100','anime',37,0,null,'planned',''],['Golden Boy','anime',6,0,null,'planned',''],['Bleach','manga',null,0,10,'completed','TYBW 10/10'],['Dr. Stone','manga',null,0,9,'completed',''],['Black Clover','manga',null,0,8,'completed',''],['One Punch Man','manga',null,0,7.5,'completed','']
];
const colors=['#275b73','#624f92','#3f6d57','#755b3e','#4e4f88','#714d69'];
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function initials(n){return n.split(/\s+/).map(x=>x[0]).join('').slice(0,3).toUpperCase()}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2800)}
function pct(e){if(!e.title?.total_episodes||e.title.media_type!=='anime')return 0;return Math.min(100,Math.round(e.progress/e.title.total_episodes*100))}
async function loadData(){if(!user)return;const [p,e,t]=await Promise.all([db.from('profiles').select('*').eq('id',user.id).single(),db.from('library_entries').select('*,title:titles(*)').eq('user_id',user.id).order('updated_at',{ascending:false}),db.from('titles').select('*').order('name')]);if(p.error&&p.error.code!=='PGRST116')throw p.error;profile=p.data;entries=e.data||[];titles=t.data||[];if(!entries.length)await seedLibrary();renderAll()}
async function seedLibrary(){const byKey=new Map(titles.map(t=>[t.name+'|'+t.media_type,t]));for(const s of seed){const key=s[0]+'|'+s[1];if(!byKey.has(key)){const {data,error}=await db.from('titles').insert({name:s[0],media_type:s[1],total_episodes:s[1]==='anime'?s[2]:null}).select().single();if(error&&error.code!=='23505')throw error;byKey.set(key,data)}}const rows=[];for(const s of seed){const t=byKey.get(s[0]+'|'+s[1]);if(t)rows.push({user_id:user.id,title_id:t.id,status:s[5],progress:s[3],rating:s[4],notes:s[6]||''})}if(rows.length){const {error}=await db.from('library_entries').upsert(rows,{onConflict:'user_id,title_id'});if(error)throw error}const {data}=await db.from('library_entries').select('*,title:titles(*)').eq('user_id',user.id).order('updated_at',{ascending:false});entries=data||[]}
function nav(page){currentPage=page;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));document.getElementById('page-'+page).classList.remove('hidden');const meta={dashboard:['Dashboard','Your collection at a glance.'],anime:['Anime Library','Track episodes, ratings, and what you want to watch next.'],manga:['Manga Library','Keep your manga progress alongside your anime.'],friends:['Friends','See what your friends are watching and reading.'],profile:['Profile','Your account, privacy, and personal stats.']}[page];document.getElementById('pageTitle').textContent=meta[0];document.getElementById('pageSub').textContent=meta[1];renderPage()}
function renderAll(){document.getElementById('sideName').textContent=profile?.display_name||profile?.username||'User';document.getElementById('sideUser').textContent='@'+(profile?.username||'user');document.getElementById('sideAvatar').textContent=initials(profile?.display_name||profile?.username||'U');renderPage()}
function renderPage(){if(currentPage==='dashboard')renderDashboard();if(currentPage==='anime')renderLibrary('anime');if(currentPage==='manga')renderLibrary('manga');if(currentPage==='friends')renderFriends();if(currentPage==='profile')renderProfile()}
function statCards(){const anime=entries.filter(e=>e.title.media_type==='anime'), watched=anime.reduce((a,e)=>a+(e.progress||0),0), watching=entries.filter(e=>e.status==='watching').length, rated=entries.filter(e=>e.rating!=null), avg=rated.length?(rated.reduce((a,e)=>a+Number(e.rating),0)/rated.length).toFixed(1):'—';return `<div class="stats"><div class="stat"><div class="muted">Total tracked</div><div class="num">${entries.length}</div></div><div class="stat"><div class="muted">Episodes watched</div><div class="num">${watched}</div></div><div class="stat"><div class="muted">Currently watching</div><div class="num">${watching}</div></div><div class="stat"><div class="muted">Average rating</div><div class="num">${avg}</div></div></div>`}
function row(e){const n=e.title.name, p=pct(e), total=e.title.total_episodes;return `<div class="anime" data-id="${e.id}"><div class="cover" style="background:linear-gradient(145deg,${colors[e.title.id%colors.length]},#18213b)">${esc(initials(n))}</div><div><div class="anime-name">${esc(n)}</div><div class="tags">${esc(e.title.media_type)} · ${esc(e.status)}${e.notes?' · '+esc(e.notes):''}</div></div><div class="prog">${e.title.media_type==='anime'?`<div class="progress"><i style="width:${p}%"></i></div><div class="ptext">${e.progress}/${total||'?'} episodes</div>`:`<div class="ptext">Manga entry</div>`}</div><div class="rating ${e.rating==null?'none':'good'}">${e.rating==null?'—':Number(e.rating).toFixed(1)}/10</div><button class="btn meta" onclick="openEdit(${e.id})">Edit</button></div>`}
function renderDashboard(){const watching=entries.filter(e=>e.status==='watching').slice(0,4);document.getElementById('page-dashboard').innerHTML=statCards()+`<div class="grid2"><div><div class="panel"><div class="panel-head"><h2>Continue watching</h2><button class="btn" onclick="nav('anime')">View library</button></div>${watching.length?watching.map(e=>`<div class="continue" style="margin-bottom:10px"><div class="muted">Currently watching</div><div class="big">${esc(e.title.name)}</div><div class="barline"><div class="progress"><i style="width:${pct(e)}%"></i></div><div class="ptext">Episode ${Math.min((e.progress||0)+1,e.title.total_episodes||1)} next · ${pct(e)}% complete</div></div><button class="btn primary" onclick="openEdit(${e.id})">Update progress</button></div>`).join(''):'<div class="empty">Nothing in Currently Watching yet.</div>'}</div><div class="panel"><div class="panel-head"><h2>Recent activity</h2></div>${entries.slice(0,7).map(row).join('')||'<div class="empty">Your library is empty.</div>'}</div></div><div><div class="panel"><div class="panel-head"><h2>Top rated</h2></div>${entries.filter(e=>e.rating!=null).sort((a,b)=>b.rating-a.rating).slice(0,7).map(row).join('')}</div><div class="panel"><div class="panel-head"><h2>Quick add</h2></div><p class="muted">Add anime or manga to your library and start tracking immediately.</p><button class="btn primary" onclick="openAdd()">＋ Add a title</button></div></div></div>`}
function renderLibrary(type){let list=entries.filter(e=>e.title.media_type===type);if(libraryFilter!=='all')list=list.filter(e=>e.status===libraryFilter);if(librarySearch)list=list.filter(e=>e.title.name.toLowerCase().includes(librarySearch.toLowerCase()));if(librarySort==='rating')list.sort((a,b)=>(b.rating??-1)-(a.rating??-1));if(librarySort==='az')list.sort((a,b)=>a.title.name.localeCompare(b.title.name));if(librarySort==='progress')list.sort((a,b)=>(pct(b)-pct(a)));const tab=(key,label)=>`<button class="tab ${libraryFilter===key?'active':''}" onclick="setFilter('${key}','${type}')">${label}</button>`;document.getElementById('page-'+type).innerHTML=`<div class="panel"><div class="toolbar"><input id="libSearch" class="input search" placeholder="Search your ${type}..." value="${esc(librarySearch)}" oninput="librarySearch=this.value;renderLibrary('${type}')"><select class="select" onchange="librarySort=this.value;renderLibrary('${type}')"><option value="rating" ${librarySort==='rating'?'selected':''}>Highest rated</option><option value="az" ${librarySort==='az'?'selected':''}>A–Z</option><option value="progress" ${librarySort==='progress'?'selected':''}>Progress</option></select><button class="btn primary" onclick="openAdd('${type}')">＋ Add</button></div><div class="tabs">${tab('all','All')} ${tab('completed','Completed')} ${tab('watching','Watching')} ${tab('planned','Plan to watch')} ${tab('paused','Paused')} ${tab('dropped','Dropped')}</div></div><div class="panel"><div class="panel-head"><h2>${list.length} title${list.length===1?'':'s'}</h2></div><div class="anime-list">${list.map(row).join('')||'<div class="empty">No titles match these filters.</div>'}</div></div>`}
function setFilter(f,type){libraryFilter=f;renderLibrary(type)}
async function renderFriends(){const box=document.getElementById('page-friends');box.innerHTML='<div class="panel"><div class="panel-head"><h2>Friends</h2></div><div class="toolbar"><input id="friendSearch" class="input search" placeholder="Search by username"><button class="btn primary" onclick="searchFriend()">Find</button></div><div id="friendResults"></div></div><div class="panel"><div class="panel-head"><h2>Your requests</h2></div><div id="requestList" class="empty">Loading...</div></div><div class="panel"><div class="panel-head"><h2>Friends list</h2></div><div id="friendsList" class="empty">Loading...</div></div>';await loadFriendsLists()}
async function loadFriendsLists(){const {data,error}=await db.from('friendships').select('*').or(`requester_id.eq.${user.id},addressee_id.eq.${user.id}`).order('created_at',{ascending:false});if(error){toast(error.message);return}const rows=data||[], ids=[...new Set(rows.flatMap(r=>[r.requester_id,r.addressee_id]).filter(id=>id!==user.id))];let ps=[];if(ids.length){const q=await db.from('profiles').select('id,username,display_name,privacy').in('id',ids);ps=q.data||[]}const pm=new Map(ps.map(p=>[p.id,p]));const incoming=rows.filter(r=>r.status==='pending'&&r.addressee_id===user.id), friends=rows.filter(r=>r.status==='accepted');document.getElementById('requestList').innerHTML=incoming.length?incoming.map(r=>friendRow(pm.get(r.requester_id),r,true)).join(''):'<div class="empty">No pending requests.</div>';document.getElementById('friendsList').innerHTML=friends.length?friends.map(r=>friendRow(pm.get(r.requester_id===user.id?r.addressee_id:r.requester_id),r,false)).join(''):'<div class="empty">No friends yet. Search for someone by username.</div>'}
function friendRow(p,r,incoming){if(!p)return '';return `<div class="friend"><div class="profile-card"><div class="avatar">${esc(initials(p.display_name||p.username))}</div><div><b>${esc(p.display_name||p.username)}</b><div class="muted">@${esc(p.username)}</div></div></div><div class="actions">${incoming?`<button class="btn primary" onclick="respondFriend(${r.id},'accepted')">Accept</button><button class="btn" onclick="respondFriend(${r.id},'declined')">Decline</button>`:`<button class="btn" onclick="viewFriend('${p.id}')">View library</button>`}</div></div>`}
async function searchFriend(){const q=document.getElementById('friendSearch').value.trim().toLowerCase();const out=document.getElementById('friendResults');if(q.length<3){out.innerHTML='<div class="notice">Enter at least 3 characters.</div>';return}const {data,error}=await db.from('profiles').select('id,username,display_name,privacy').ilike('username',`%${q}%`).neq('id',user.id).limit(8);if(error){out.innerHTML='<div class="notice">Could not search right now.</div>';return}out.innerHTML=data?.length?data.map(p=>`<div class="friend"><div class="profile-card"><div class="avatar">${esc(initials(p.display_name||p.username))}</div><div><b>${esc(p.display_name||p.username)}</b><div class="muted">@${esc(p.username)}</div></div></div><button class="btn primary" onclick="sendFriend('${p.id}')">Add friend</button></div>`).join(''):'<div class="empty">No matching usernames.</div>'}
async function sendFriend(id){const {error}=await db.from('friendships').insert({requester_id:user.id,addressee_id:id,status:'pending'});if(error){toast(error.code==='23505'?'A friendship/request already exists.':error.message);return}toast('Friend request sent');loadFriendsLists()}
async function respondFriend(id,status){const {error}=await db.from('friendships').update({status}).eq('id',id).eq('addressee_id',user.id);if(error)toast(error.message);else{toast(status==='accepted'?'Friend added':'Request declined');loadFriendsLists()}}
async function viewFriend(id){const {data:p}=await db.from('profiles').select('username,display_name,privacy').eq('id',id).single();if(!p)return;const {data:list,error}=await db.from('library_entries').select('*,title:titles(*)').eq('user_id',id).order('updated_at',{ascending:false});if(error){toast('That library is not available.');return}openModal(`<h2>${esc(p.display_name||p.username)}'s Library</h2><p class="muted">@${esc(p.username)} · ${esc(p.privacy)} profile</p><div class="anime-list">${(list||[]).map(row).join('')||'<div class="empty">No titles to show.</div>'}</div><div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div>`)}
function renderProfile(){const rated=entries.filter(e=>e.rating!=null),avg=rated.length?(rated.reduce((a,e)=>a+Number(e.rating),0)/rated.length).toFixed(1):'—';document.getElementById('page-profile').innerHTML=`<div class="panel"><div class="profile-card"><div class="avatar profile-big">${esc(initials(profile?.display_name||profile?.username||'U'))}</div><div><h2 style="margin:0">${esc(profile?.display_name||profile?.username||'User')}</h2><div class="muted">@${esc(profile?.username||'user')}</div></div></div></div><div class="grid2"><div class="panel"><div class="panel-head"><h2>Profile settings</h2></div><form id="profileForm" class="form"><div class="field"><label>Display name</label><input id="profileDisplay" class="input" maxlength="32" value="${esc(profile?.display_name||'')}"></div><div class="field"><label>Username</label><input id="profileUsername" class="input" maxlength="24" value="${esc(profile?.username||'')}"></div><div class="field"><label>Bio</label><textarea id="profileBio" class="input" maxlength="160" rows="3" placeholder="A short bio">${esc(profile?.bio||'')}</textarea></div><div class="field"><label>Library privacy</label><select id="profilePrivacy" class="select"><option value="private" ${profile?.privacy==='private'?'selected':''}>Private — only you</option><option value="friends" ${profile?.privacy==='friends'?'selected':''}>Friends — accepted friends</option><option value="public" ${profile?.privacy==='public'?'selected':''}>Public — signed-in users</option></select></div><button class="btn primary" type="submit">Save profile</button></form></div><div class="panel"><div class="panel-head"><h2>Your stats</h2></div><div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><div class="muted">Titles</div><div class="num">${entries.length}</div></div><div class="stat"><div class="muted">Average</div><div class="num">${avg}</div></div><div class="stat"><div class="muted">Completed</div><div class="num">${entries.filter(e=>e.status==='completed').length}</div></div><div class="stat"><div class="muted">Favorites</div><div class="num">${entries.filter(e=>e.is_favorite).length}</div></div></div><button class="btn danger" onclick="signOut()">Sign out</button></div></div>`;document.getElementById('profileForm').onsubmit=saveProfile}
async function saveProfile(ev){ev.preventDefault();const username=document.getElementById('profileUsername').value.trim().toLowerCase();if(!/^[a-z0-9_]{3,24}$/.test(username)){toast('Username must be 3–24 letters, numbers, or underscores.');return}const patch={username,display_name:document.getElementById('profileDisplay').value.trim(),bio:document.getElementById('profileBio').value.trim(),privacy:document.getElementById('profilePrivacy').value};const {data,error}=await db.from('profiles').update(patch).eq('id',user.id).select().single();if(error){toast(error.code==='23505'?'That username is already taken.':error.message);return}profile=data;renderAll();toast('Profile saved')}
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.remove('hidden')};function closeModal(){document.getElementById('modal').classList.add('hidden')};document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()}
function openAdd(type='anime'){openModal(`<h2>Add ${type}</h2><form id="addForm" class="form"><div class="field"><label>Title</label><input id="addName" class="input" required placeholder="e.g. Cowboy Bebop"></div><div class="field"><label>Type</label><select id="addType" class="select"><option value="anime" ${type==='anime'?'selected':''}>Anime</option><option value="manga" ${type==='manga'?'selected':''}>Manga</option></select></div><div class="field"><label>Total episodes (anime only)</label><input id="addTotal" class="input" type="number" min="0" placeholder="Optional"></div><div class="field"><label>Status</label><select id="addStatus" class="select"><option value="planned">Plan to watch</option><option value="watching">Watching</option><option value="completed">Completed</option><option value="paused">Paused</option><option value="dropped">Dropped</option></select></div><div class="field"><label>Rating (optional)</label><input id="addRating" class="input" type="number" min="0" max="10" step="0.1" placeholder="0–10"></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Add title</button></div></form>`);document.getElementById('addForm').onsubmit=addTitle}
async function addTitle(ev){ev.preventDefault();const name=document.getElementById('addName').value.trim(),type=document.getElementById('addType').value,total=Number(document.getElementById('addTotal').value)||null,status=document.getElementById('addStatus').value,rating=document.getElementById('addRating').value===''?null:Number(document.getElementById('addRating').value);if(!name)return;let {data:t,error}=await db.from('titles').select('*').eq('name',name).eq('media_type',type).maybeSingle();if(error){toast(error.message);return}if(!t){const q=await db.from('titles').insert({name,media_type:type,total_episodes:type==='anime'?total:null}).select().single();if(q.error){toast(q.error.message);return}t=q.data}const q=await db.from('library_entries').insert({user_id:user.id,title_id:t.id,status,progress:status==='completed'?(total||0):0,rating});if(q.error){toast(q.error.code==='23505'?'Already in your library.':q.error.message);return}closeModal();await loadData();toast('Title added')}
function openEdit(id){const e=entries.find(x=>x.id===id);if(!e)return;openModal(`<h2>Edit ${esc(e.title.name)}</h2><form id="editForm" class="form"><div class="field"><label>Status</label><select id="editStatus" class="select">${['planned','watching','completed','paused','dropped'].map(x=>`<option ${e.status===x?'selected':''} value="${x}">${x==='planned'?'Plan to watch':x[0].toUpperCase()+x.slice(1)}</option>`).join('')}</select></div><div class="field"><label>Progress ${e.title.media_type==='anime'?'(episodes)':''}</label><input id="editProgress" class="input" type="number" min="0" max="${e.title.total_episodes||999999}" value="${e.progress||0}"></div><div class="field"><label>Rating</label><input id="editRating" class="input" type="number" min="0" max="10" step="0.1" value="${e.rating??''}" placeholder="0–10"></div><div class="field"><label>Notes</label><textarea id="editNotes" class="input" rows="3" maxlength="300">${esc(e.notes||'')}</textarea></div><label class="row"><input id="editFav" type="checkbox" ${e.is_favorite?'checked':''}> Favorite</label><div class="modal-actions"><button type="button" class="btn danger" onclick="deleteEntry(${e.id})">Remove</button><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div></form>`);document.getElementById('editForm').onsubmit=ev=>saveEdit(ev,id)}
async function saveEdit(ev,id){ev.preventDefault();const e=entries.find(x=>x.id===id),status=document.getElementById('editStatus').value,progress=Number(document.getElementById('editProgress').value)||0,r=document.getElementById('editRating').value,patch={status,progress,rating:r===''?null:Number(r),notes:document.getElementById('editNotes').value.trim(),is_favorite:document.getElementById('editFav').checked,completed_at:status==='completed'?new Date().toISOString():null};if(e?.title.total_episodes&&progress>e.title.total_episodes){toast('Progress cannot exceed total episodes.');return}const {error}=await db.from('library_entries').update(patch).eq('id',id).eq('user_id',user.id);if(error){toast(error.message);return}closeModal();await loadData();toast('Updated')}
async function deleteEntry(id){if(!confirm('Remove this title from your library?'))return;const {error}=await db.from('library_entries').delete().eq('id',id).eq('user_id',user.id);if(error){toast(error.message);return}closeModal();await loadData();toast('Removed')}
async function signOut(){await db.auth.signOut();user=null;profile=null;entries=[];document.getElementById('appView').classList.add('hidden');document.getElementById('authView').classList.remove('hidden')}
function setAuthMode(mode){authMode=mode;const signup=mode==='signup';document.getElementById('nameField').classList.toggle('hidden',!signup);document.getElementById('usernameField').classList.toggle('hidden',!signup);document.getElementById('authSubmit').textContent=signup?'Create account':'Sign in';document.getElementById('switchText').textContent=signup?'Already have an account?':"Don't have an account?";document.getElementById('switchAuth').textContent=signup?'Sign in':'Create one';document.getElementById('password').autocomplete=signup?'new-password':'current-password'}
async function authSubmit(ev){ev.preventDefault();const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,notice=document.getElementById('authNotice');notice.classList.add('hidden');if(authMode==='signup'){const display=document.getElementById('displayName').value.trim(),username=document.getElementById('username').value.trim().toLowerCase();if(!/^[a-z0-9_]{3,24}$/.test(username)){notice.textContent='Username must be 3–24 letters, numbers, or underscores.';notice.classList.remove('hidden');return}const {data,error}=await db.auth.signUp({email,password,options:{data:{display_name:display}}});if(error){notice.textContent=error.message;notice.classList.remove('hidden');return}if(!data.session){notice.textContent='Account created. Check your email to confirm your account, then sign in.';notice.classList.remove('hidden');setAuthMode('login');return}user=data.user;await finishLogin(username,display)}else{const {data,error}=await db.auth.signInWithPassword({email,password});if(error){notice.textContent=error.message;notice.classList.remove('hidden');return}user=data.user;await finishLogin()}}
async function finishLogin(username,display){document.getElementById('authView').classList.add('hidden');document.getElementById('appView').classList.remove('hidden');try{await loadData();if(username){const q=await db.from('profiles').update({username,display_name:display||username}).eq('id',user.id).select().single();if(q.error){toast(q.error.code==='23505'?'Username already taken; choose another in Profile.':q.error.message)}else{profile=q.data;renderAll()}}}catch(e){console.error(e);toast('Could not load your tracker data: '+e.message)}}
document.getElementById('switchAuth').onclick=()=>setAuthMode(authMode==='login'?'signup':'login');document.getElementById('authForm').onsubmit=authSubmit;document.getElementById('addBtn').onclick=()=>openAdd();document.getElementById('refreshBtn').onclick=()=>loadData();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>nav(b.dataset.page));
db.auth.getSession().then(async({data})=>{if(data.session){user=data.session.user;document.getElementById('authView').classList.add('hidden');document.getElementById('appView').classList.remove('hidden');try{await loadData()}catch(e){toast(e.message)}}});db.auth.onAuthStateChange((_event,session)=>{if(session&&!user){user=session.user;document.getElementById('authView').classList.add('hidden');document.getElementById('appView').classList.remove('hidden');loadData().catch(e=>toast(e.message))}});
setAuthMode('login');nav('dashboard');
</script>
</body></html>
