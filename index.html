*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#12294a 0,#060b14 35%),var(--bg);color:var(--text);font:15px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{border-right:1px solid var(--line);padding:22px 16px;background:#07101ddd;backdrop-filter:blur(12px);position:sticky;top:0;height:100vh}.brand{font-size:22px;font-weight:900;letter-spacing:-.5px;padding:8px 10px 28px}.brand span{color:var(--cyan)}.nav button{width:100%;text-align:left;background:none;border:0;color:var(--muted);padding:12px 13px;border-radius:12px;margin:3px 0}.nav button:hover,.nav button.active{background:#12233a;color:#fff}.side-bottom{position:absolute;bottom:18px;left:16px;right:16px}.user-mini{border:1px solid var(--line);background:#0b1524;border-radius:14px;padding:12px}.avatar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#06101b;font-weight:900}.row{display:flex;align-items:center;gap:10px}.main{padding:28px 34px;max-width:1500px;width:100%;margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}.eyebrow{color:var(--cyan);font-size:12px;text-transform:uppercase;letter-spacing:1.5px;font-weight:800}.title{font-size:34px;font-weight:900;letter-spacing:-1.5px;margin:4px 0}.muted{color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#0d192a;color:#fff;padding:10px 14px;border-radius:6px}.btn:hover{border-color:#35506f}.btn.primary{border:0;background:linear-gradient(135deg,#4bcfff,#8875ff);color:#06101b;font-weight:900}.btn.danger{color:#ff9bab}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat,.panel,.card{background:linear-gradient(180deg,#0d1829dd,#0a1321dd);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}.stat{padding:18px}.stat .num{font-size:28px;font-weight:900;margin-top:5px}.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}.panel{padding:20px;margin-bottom:16px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.panel h2{font-size:18px;margin:0}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tab{border:1px solid transparent;background:#0a1422;color:var(--muted);padding:8px 11px;border-radius:5px}.tab.active{background:#172a43;color:#fff;border-color:#2a405e}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.input,.select{background:#07111f;border:1px solid var(--line);color:#fff;padding:10px 12px;border-radius:6px;outline:none}.input:focus,.select:focus{border-color:#4d789f}.search{flex:1;min-width:190px}.anime-list{display:grid;gap:9px}.anime{display:grid;grid-template-columns:50px minmax(180px,1fr) 150px 80px 85px;align-items:center;gap:14px;padding:12px;border:1px solid transparent;border-radius:6px;background:#091322}.anime:hover{border-color:#223754;background:#0c1727}.cover{width:50px;height:66px;border-radius:5px;display:grid;place-items:center;font-weight:900;color:#fff;background:linear-gradient(145deg,#1f5672,#614b9a);box-shadow:inset 0 0 30px #0004}.anime-name{font-weight:850}.tags{font-size:12px;color:var(--muted);margin-top:4px}.progress{height:6px;background:#18253a;border-radius:2px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));border-radius:2px}.ptext{font-size:11px;color:var(--muted);margin-top:5px}.rating{font-weight:900}.rating.good{color:#75e7b0}.rating.none{color:#61738d}.continue{padding:20px;background:linear-gradient(135deg,#10233b,#12152d);border:1px solid #29405e;border-radius:8px}.continue .big{font-size:22px;font-weight:900}.barline{margin:14px 0}.friend{display:flex;align-items:c <body>
<div id="authView" class="auth">

    <p class="muted" style="text-align:center;margin-top:0">Your anime & manga library, built for you and your friends.</p>

</div>

</aside>

</div>

<script>
const SUPABASE_URL='https://laxrueezpovgtyczeweh.supabase.co';
const SUPABASE_KEY='sb_publishable_APP_OdQ6qCDc82VASpJUdQ_jCdVElen';
const {createClient}=supabase; const db=createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null, profile=null, entries=[], titles=[], currentPage='dashboard', libraryFilter='all', librarySearch='', librarySort='rating', authMode='login';
const seed=[
['Attack on Titan','anime',87,87,10,'completed','Masterpiece • TOP 3'],['Fullmetal Alchemist: Brotherhood','anime',64,64,10,'completed','TOP 3'],['Samurai Champloo','anime',26,26,10,'completed','TOP 1'],['Vinland Saga','anime',48,48,10,'completed',''],['Gurren Lagann','anime',27,27,10,'completed','Amazing'],['Bleach','anime',366,366,9,'completed','Manga 9/10 • TYBW 10/10'],['Dr. Stone','anime',81,81,9,'completed','Manga 9/10'],['Demon Slayer','anime',63,63,8.4,'completed','Pretty good'],['One Punch Man','anime',24,24,7.5,'completed','Anime + Manga'],['Black Clover','anime',170,170,8,'completed','Anime + Manga • Great'],['Solo Leveling','anime',25,25,7,'completed',''],['The God of High School','anime',13,13,8,'completed',''],['Anohana: The Flower We Saw That Day','anime',11,11,10,'completed','100/10'],['Re:Zero − Starting Life in Another World','anime',66,0,null,'watching','Currently watching'],['Soul Eater','anime',51,0,null,'watching','Currently watching'],['Steins;Gate','anime',24,0,null,'planned',''],['Sonny Boy','anime',12,0,null,'planned',''],['Yamada-kun and the Seven Witches','anime',12,0,null,'planned',''],['World Trigger','anime',99,0,null,'planned',''],['Vivy: Fluorite Eye’s Song','anime',13,0,null,'planned',''],['Angel Beats!','anime',13,0,null,'planned',''],['Psycho-Pass','anime',41,0,null,'planned',''],['Frieren: Beyond Journey’s End','anime',28,0,null,'planned',''],['86 Eighty-Six','anime',23,0,null,'planned',''],['Akudama Drive','anime',12,0,null,'planned',''],['Bungo Stray Dogs','anime',61,0,null,'planned',''],['Mob Psycho 100','anime',37,0,null,'planned',''],['Golden Boy','anime',6,0,null,'planned',''],['Bleach','manga',null,0,10,'completed','TYBW 10/10'],['Dr. Stone','manga',null,0,9,'completed',''],['Black Clover','manga',null,0,8,'completed',''],['One Punch Man','manga',null,0,7.5,'completed','']
];
const colors=['#275b73','#624f92','#3f6d57','#755b3e','#4e4f88','#714d69'];
function esc(s=''){return String(s).replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function initials(n){return n.split(/\s+/).filter(Boolean).slice(0,3).map(x=>x[0]).join('').toUpperCase()}
function statusLabel(s){return ({completed:'Completed',watching:'Watching',planned:'Plan to watch',paused:'Paused',dropped:'Dropped'})[s]||s}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2200)}
function setAuthNotice(t){const el=document.getElementById('authNotice');el.textContent=t;el.classList.toggle('hidden',!t)}
function showModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function row(e,readOnly=false){const t=e.title||{};const total=t.total_episodes||t.total_chapters||0;const pct=total?Math.min(100,Math.round((e.progress||0)/total*100)):0;return `<div class="anime"><div class="cover" style="background:linear-gradient(145deg,${colors[e.id%colors.length]},#614b9a)">${esc(initials(t.name||'?'))}</div><div><div class="anime-name">${esc(t.name||'Untitled')}</div><div class="tags">${esc(statusLabel(e.status))}${e.notes?` • ${esc(e.notes)}`:''}</div></div><div class="prog"><div class="progress"><i style="width:${pct}%"></i></div><div class="ptext">${total?`${e.progress||0} / ${total}`:'No progress tracked'}</div></div><div class="meta"><div class="rating ${e.rating==null?'none':'good'}">${e.rating==null?'—':Number(e.rating).toFixed(1)}/10</div><div class="ptext">${e.is_favorite?'★ Favorite':''}</div></div>${readOnly?'':`<button class="btn" onclick="openEdit(${e.id})">Edit</button>`}</div>`}
function filtered(type){let a=entries.filter(e=>e.title?.media_type===type);if(libraryFilter!=='all')a=a.filter(e=>e.status===libraryFilter);if(librarySearch)a=a.filter(e=>e.title.name.toLowerCase().includes(librarySearch.toLowerCase()));a.sort((x,y)=>librarySort==='name'?x.title.name.localeCompare(y.title.name):librarySort==='progress'?((y.progress||0)/(y.title.total_episodes||1)-(x.progress||0)/(x.title.total_episodes||1)):(y.rating??-1)-(x.rating??-1));return a}
function render(){
 const anime=entries.filter(e=>e.title?.media_type==='anime'), manga=entries.filter(e=>e.title?.media_type==='manga');
 const watched=anime.reduce((s,e)=>s+(e.progress||0),0), watching=entries.filter(e=>e.status==='watching').length, rated=entries.filter(e=>e.rating!=null), avg=rated.length?(rated.reduce((s,e)=>s+Number(e.rating),0)/rated.length).toFixed(1):'—';
 document.getElementById('sideName').textContent=profile?.display_name||profile?.username||'User';document.getElementById('sideUser').textContent='@'+(profile?.username||'user');document.getElementById('sideAvatar').textContent=initials(profile?.display_name||profile?.username||'U');
 const titlesByPage={dashboard:['Dashboard','Your collection at a glance.'],anime:['Anime Library','Track every series you watch.'],manga:['Manga Library','Keep your manga progress and ratings in one place.'],friends:['Friends','See what your friends are watching and reading.'],profile:['Profile','Your account, privacy, and personal stats.']};document.getElementById('pageTitle').textContent=titlesByPage[currentPage][0];document.getElementById('pageSub').textContent=titlesByPage[currentPage][1];
 document.querySelectorAll('.page').forEach(x=>x.classList.toggle('hidden',x.id!=='page-'+currentPage));document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===currentPage));
 document.getElementById('page-dashboard').innerHTML=`<div class="stats"><div class="stat"><div class="muted">Total tracked</div><div class="num">${entries.length}</div></div><div class="stat"><div class="muted">Episodes watched</div><div class="num">${watched}</div></div><div class="stat"><div class="muted">Currently watching</div><div class="num">${watching}</div></div><div class="stat"><div class="muted">Average rating</div><div class="num">${avg}</div></div></div><div class="grid2"><div><div class="panel"><div class="panel-head"><h2>Continue Watching</h2></div>${(()=>{const e=entries.find(x=>x.status==='watching');if(!e)return '<div class="empty">Nothing currently watching.</div>';const total=e.title.total_episodes||0,pct=total?Math.round((e.progress||0)/total*100):0;return `<div class="continue"><div class="muted">Currently watching</div><div class="big">${esc(e.title.name)}</div><div class="barline"><div class="progress"><i style="width:${pct}%"></i></div><div class="ptext">Episode ${(e.progress||0)+1} next • ${pct}%</div></div><button class="btn primary" onclick="openEdit(${e.id})">Update progress</button></div>`})()}</div><div class="panel"><div class="panel-head"><h2>Top Rated</h2><button class="btn" onclick="go('anime')">View library</button></div><div class="anime-list">${anime.filter(e=>e.rating!=null).sort((a,b)=>b.rating-a.rating).slice(0,5).map(e=>row(e)).join('')||'<div class="empty">No rated anime yet.</div>'}</div></div></div><div><div class="panel"><div class="panel-head"><h2>Collection</h2></div><div class="profile-card"><div class="avatar profile-big">${esc(initials(profile?.display_name||profile?.username||'U'))}</div><div><b>${esc(profile?.display_name||profile?.username||'User')}</b><div class="muted">${anime.length} anime • ${manga.length} manga</div></div></div></div><div class="panel"><div class="panel-head"><h2>Recently Added</h2></div>${entries.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,5).map(e=>row(e)).join('')||'<div class="empty">Your library is empty.</div>'}</div></div></div>`;
 renderLibrary('anime');renderLibrary('manga');
 document.getElementById('page-friends').innerHTML=renderFriends();document.getElementById('page-profile').innerHTML=renderProfile();
}
function renderLibrary(type){const arr=filtered(type);document.getElementById('page-'+type).innerHTML=`<div class="panel"><div class="toolbar"><input class="input search" placeholder="Search ${type}..." value="${esc(librarySearch)}" oninput="librarySearch=this.value;renderLibrary('${type}')"><select class="select" onchange="libraryFilter=this.value;renderLibrary('${type}')"><option value="all">All</option><option value="completed" ${libraryFilter==='completed'?'selected':''}>Completed</option><option value="watching" ${libraryFilter==='watching'?'selected':''}>Watching</option><option value="planned" ${libraryFilter==='planned'?'selected':''}>Plan to watch</option></select><select class="select" onchange="librarySort=this.value;renderLibrary('${type}')"><option value="rating">Highest rated</option><option value="name" ${librarySort==='name'?'selected':''}>A–Z</option><option value="progress" ${librarySort==='progress'?'selected':''}>Progress</option></select></div><div class="anime-list">${arr.map(e=>row(e)).join('')||'<div class="empty">Nothing here yet. Add a title to get started.</div>'}</div></div>`}
function renderFriends(){return `<div class="grid2"><div class="panel"><div class="panel-head"><h2>Find friends</h2></div><div class="toolbar"><input id="friendSearch" class="input search" placeholder="Search by username or name"><button class="btn primary" onclick="searchFriends()">Search</button></div><div id="friendResults"><div class="empty">Search for a friend to send a request.</div></div></div><div class="panel"><div class="panel-head"><h2>Your friends</h2></div><div id="friendsList"><div class="empty">Loading friends…</div></div></div></div>`}
function renderProfile(){const anime=entries.filter(e=>e.title?.media_type==='anime'),manga=entries.filter(e=>e.title?.media_type==='manga'),rated=entries.filter(e=>e.rating!=null),avg=rated.length?(rated.reduce((s,e)=>s+Number(e.rating),0)/rated.length).toFixed(1):'—';return `<div class="grid2"><div class="panel"><div class="profile-card"><div class="avatar profile-big">${esc(initials(profile?.display_name||profile?.username||'U'))}</div><div><h2 style="margin:0">${esc(profile?.display_name||profile?.username||'User')}</h2><div class="muted">@${esc(profile?.username||'user')}</div></div></div><p class="muted">${esc(profile?.bio||'No bio yet.')}</p><hr style="border:0;border-top:1px solid var(--line)"><div class="stats" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><div class="muted">Anime</div><div class="num">${anime.length}</div></div><div class="stat"><div class="muted">Manga</div><div class="num">${manga.length}</div></div><div class="stat"><div class="muted">Avg. rating</div><div class="num">${avg}</div></div></div></div><div class="panel"><div class="panel-head"><h2>Profile settings</h2></div><form class="form" onsubmit="saveProfile(event)"><div class="field"><label>Display name</label><input id="pDisplay" class="input" maxlength="32" value="${esc(profile?.display_name||'')}"></div><div class="field"><label>Username</label><input id="pUsername" class="input" maxlength="24" value="${esc(profile?.username||'')}"></div><div class="field"><label>Bio</label><textarea id="pBio" class="input" rows="4" maxlength="160">${esc(profile?.bio||'')}</textarea></div><div class="field"><label>Library privacy</label><select id="pPrivacy" class="select"><option value="private" ${profile?.privacy==='private'?'selected':''}>Private</option><option value="friends" ${profile?.privacy==='friends'?'selected':''}>Friends</option><option value="public" ${profile?.privacy==='public'?'selected':''}>Public</option></select></div><button class="btn primary">Save profile</button></form><button class="btn danger" style="margin-top:12px" onclick="signOut()">Sign out</button></div></div>`}
async function searchFriends(){const q=document.getElementById('friendSearch').value.trim();if(!q)return;const box=document.getElementById('friendResults');const {data,error}=await db.from('profiles').select('id,username,display_name').or(`username.ilike.%${q}%,display_name.ilike.%${q}%`).neq('id',user.id).limit(10);if(error){box.innerHTML='<div class="empty">Could not search right now.</div>';return}box.innerHTML=data?.length?data.map(p=>`<div class="friend"><div><b>${esc(p.display_name||p.username)}</b><div class="muted">@${esc(p.username)}</div></div><button class="btn primary" onclick="sendFriend('${p.id}')">Add friend</button></div>`).join(''):'<div class="empty">No users found.</div>'}
async function loadFriends(){const box=document.getElementById('friendsList');const {data,error}=await db.from('friendships').select('id,requester_id,addressee_id,status').or(`requester_id.eq.${user.id},addressee_id.eq.${user.id}`);if(error){box.innerHTML='<div class="empty">Could not load friends.</div>';return}const ids=[...new Set((data||[]).flatMap(f=>[f.requester_id,f.addressee_id]).filter(x=>x!==user.id))];if(!ids.length){box.innerHTML='<div class="empty">No friends yet.</div>';return}const {data:ps}=await db.from('profiles').select('id,username,display_name').in('id',ids);box.innerHTML=(ps||[]).map(p=>{const f=data.find(x=>x.requester_id===p.id||x.addressee_id===p.id);const incoming=f?.addressee_id===user.id&&f?.status==='pending';return `<div class="friend"><div><b>${esc(p.display_name||p.username)}</b><div class="muted">@${esc(p.username)} • ${f?.status||'pending'}</div></div><div>${incoming?`<button class="btn primary" onclick="respondFriend(${f.id},'accepted')">Accept</button> <button class="btn" onclick="respondFriend(${f.id},'declined')">Decline</button>`:f?.status==='accepted'?`<button class="btn" onclick="viewFriend('${p.id}','${esc(p.display_name||p.username)}')">View library</button>`:''}</div></div>`}).join('')}
async function sendFriend(id){const {error}=await db.from('friendships').insert({requester_id:user.id,addressee_id:id});toast(error?'Could not send request.':'Friend request sent!');if(!error)loadFriends()}
async function respondFriend(id,status){const {error}=await db.from('friendships').update({status,updated_at:new Date().toISOString()}).eq('id',id);toast(error?'Could not update request.':'Updated!');loadFriends()}
async function viewFriend(id,name){const {data,error}=await db.from('library_entries').select('*,title:titles(*)').eq('user_id',id);if(error){toast('Could not view this library.');return}showModal(`<h2>${esc(name)}'s Library</h2><div class="anime-list">${(data||[]).map(e=>row(e,true)).join('')||'<div class="empty">This library is empty or private.</div>'}</div><div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div>`)}
async function saveProfile(ev){ev.preventDefault();const username=document.getElementById('pUsername').value.trim().toLowerCase();if(!/^[a-z0-9_]{3,24}$/.test(username)){toast('Username must be 3–24 letters, numbers, or underscores.');return}const {data,error}=await db.from('profiles').update({display_name:document.getElementById('pDisplay').value.trim(),username,bio:document.getElementById('pBio').value.trim(),privacy:document.getElementById('pPrivacy').value,updated_at:new Date().toISOString()}).eq('id',user.id).select().single();if(error){toast(error.message.includes('duplicate')?'That username is already taken.':'Could not save profile.');return}profile=data;toast('Profile saved!');render()}
function openAdd(){showModal(`<h2>Add title</h2><form class="form" onsubmit="addTitle(event)"><div class="field"><label>Name</label><input id="newName" class="input" required placeholder="e.g. Jujutsu Kaisen"></div><div class="field"><label>Type</label><select id="newType" class="select"><option value="anime">Anime</option><option value="manga">Manga</option></select></div><div class="field"><label>Total episodes/chapters (optional)</label><input id="newTotal" class="input" type="number" min="0" placeholder="24"></div><div class="field"><label>Status</label><select id="newStatus" class="select"><option value="planned">Plan to watch</option><option value="watching">Watching</option><option value="completed">Completed</option></select></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Add title</button></div></form>`)}
async function addTitle(ev){ev.preventDefault();const name=document.getElementById('newName').value.trim(),type=document.getElementById('newType').value,total=Number(document.getElementById('newTotal').value)||null,status=document.getElementById('newStatus').value;let {data:t,error}=await db.from('titles').select('*').eq('name',name).eq('media_type',type).maybeSingle();if(error){toast('Could not add title.');return}if(!t){const payload={name,media_type:type,total_episodes:type==='anime'?total:null,total_chapters:type==='manga'?total:null};const r=await db.from('titles').insert(payload).select().single();if(r.error){toast('Could not create title.');return}t=r.data}const r=await db.from('library_entries').insert({user_id:user.id,title_id:t.id,status,progress:status==='completed'?(total||0):0,rating:null,notes:'',is_favorite:false}).select('*,title:titles(*)').single();if(r.error){toast('That title is already in your library.');return}entries.push(r.data);closeModal();toast('Title added!');render()}
function openEdit(id){const e=entries.find(x=>x.id===id);if(!e)return;const total=e.title.total_episodes||e.title.total_chapters||0;showModal(`<h2>Edit ${esc(e.title.name)}</h2><form class="form" onsubmit="saveEdit(event,${id})"><div class="field"><label>Status</label><select id="eStatus" class="select"><option value="planned" ${e.status==='planned'?'selected':''}>Plan to watch</option><option value="watching" ${e.status==='watching'?'selected':''}>Watching</option><option value="completed" ${e.status==='completed'?'selected':''}>Completed</option><option value="paused" ${e.status==='paused'?'selected':''}>Paused</option><option value="dropped" ${e.status==='dropped'?'selected':''}>Dropped</option></select></div><div class="field"><label>Progress ${total?`(of ${total})`:''}</label><input id="eProgress" class="input" type="number" min="0" max="${total||99999}" value="${e.progress||0}"></div><div class="field"><label>Rating (0–10)</label><input id="eRating" class="input" type="number" min="0" max="10" step="0.1" value="${e.rating??''}" placeholder="8.5"></div><div class="field"><label>Notes</label><textarea id="eNotes" class="input" rows="3">${esc(e.notes||'')}</textarea></div><label class="row"><input id="eFav" type="checkbox" ${e.is_favorite?'checked':''}> Favorite</label><div class="modal-actions"><button type="button" class="btn danger" onclick="deleteEntry(${id})">Delete</button><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div></form>`)}
async function saveEdit(ev,id){ev.preventDefault();const e=entries.find(x=>x.id===id);if(!e)return;const total=e.title.total_episodes||e.title.total_chapters||0;let progress=Math.max(0,Number(document.getElementById('eProgress').value)||0);if(total)progress=Math.min(progress,total);let rating=document.getElementById('eRating').value;rating=rating===''?null:Number(rating);if(rating!=null)rating=Math.max(0,Math.min(10,rating));const payload={status:document.getElementById('eStatus').value,progress,rating,notes:document.getElementById('eNotes').value.trim(),is_favorite:document.getElementById('eFav').checked,updated_at:new Date().toISOString()};const {data,error}=await db.from('library_entries').update(payload).eq('id',id).select('*,title:titles(*)').single();if(error){toast('Could not save changes.');return}Object.assign(e,data);closeModal();toast('Saved!');render()}
async function deleteEntry(id){if(!confirm('Remove this title from your library?'))return;const {error}=await db.from('library_entries').delete().eq('id',id);if(error){toast('Could not delete title.');return}entries=entries.filter(e=>e.id!==id);closeModal();toast('Removed.');render()}
async function seedLibrary(){for(const s of seed){let {data:t}=await db.from('titles').select('*').eq('name',s[0]).eq('media_type',s[1]).maybeSingle();if(!t){const r=await db.from('titles').insert({name:s[0],media_type:s[1],total_episodes:s[1]==='anime'?s[2]:null}).select().single();if(r.error)continue;t=r.data}await db.from('library_entries').insert({user_id:user.id,title_id:t.id,status:s[5],progress:s[3],rating:s[4],notes:s[6],is_favorite:false})}}
async function loadData(){if(!user)return;let {data:p}=await db.from('profiles').select('*').eq('id',user.id).single();profile=p;if(!profile)return;let {data}=await db.from('library_entries').select('*,title:titles(*)').eq('user_id',user.id);entries=data||[];if(!entries.length){await seedLibrary();const r=await db.from('library_entries').select('*,title:titles(*)').eq('user_id',user.id);entries=r.data||[]}}
async function finishLogin(){const {data:{session}}=await db.auth.getSession();if(!session)return;user=session.user;await loadData();document.getElementById('authView').classList.add('hidden');document.getElementById('appView').classList.remove('hidden');render();loadFriends()}
async function signOut(){await db.auth.signOut();location.reload()}
function go(page){currentPage=page;libraryFilter='all';librarySearch='';render();if(page==='friends')loadFriends()}
document.getElementById('sideNav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});document.getElementById('mobileNav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});document.getElementById('addBtn').onclick=openAdd;document.getElementById('refreshBtn').onclick=async()=>{await loadData();render();if(currentPage==='friends')loadFriends();toast('Refreshed!')};document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.getElementById('switchAuth').onclick=()=>{authMode=authMode==='login'?'signup':'login';document.getElementById('nameField').classList.toggle('hidden',authMode!=='signup');document.getElementById('usernameField').classList.toggle('hidden',authMode!=='signup');document.getElementById('authSubmit').textContent=authMode==='login'?'Sign in':'Create account';document.getElementById('switchText').textContent=authMode==='login'?"Don't have an account?":'Already have an account?';document.getElementById('switchAuth').textContent=authMode==='login'?'Create one':'Sign in';setAuthNotice('')};
document.getElementById('authForm').onsubmit=async e=>{e.preventDefault();setAuthNotice('');const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(authMode==='login'){const r=await db.auth.signInWithPassword({email,password});if(r.error){setAuthNotice(r.error.message);return}await finishLogin()}else{const username=document.getElementById('username').value.trim().toLowerCase();if(!/^[a-z0-9_]{3,24}$/.test(username)){setAuthNotice('Username must be 3–24 letters, numbers, or underscores.');return}const r=await db.auth.signUp({email,password,options:{data:{display_name:document.getElementById('displayName').value.trim()}}});if(r.error){setAuthNotice(r.error.message);return}if(r.data.user){await db.from('profiles').update({username,display_name:document.getElementById('displayName').value.trim()}).eq('id',r.data.user.id)}if(r.data.session){await finishLogin()}else setAuthNotice('Account created. Check your email to confirm your account, then sign in.')}};
db.auth.onAuthStateChange((event,session)=>{if(session&&!user)finishLogin()});finishLogin();
</script>
</body>
